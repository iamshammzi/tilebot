name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          if [ -f TileBot.zip ]; then
            unzip -q -o TileBot.zip
          fi
          echo "android.useAndroidX=true" >> TileBot/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> TileBot/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: TileBot
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TileBot-apk
          path: TileBot/app/build/outputs/apk/debug/app-debug.apk
