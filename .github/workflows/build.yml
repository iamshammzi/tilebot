name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip and patch project
        run: |
          if [ -f TileBot.zip ]; then
            unzip -q -o TileBot.zip
          fi

          echo "android.useAndroidX=true" >> TileBot/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> TileBot/gradle.properties

          # 1. Config.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/Config.kt
          package com.example.tilebot

          object Config {
              const val LANES = 4
              const val SCALE = 4

              val laneFractions = floatArrayOf(0.125f, 0.375f, 0.625f, 0.875f)

              @Volatile var triggerFrac = 0.65f
              @Volatile var darkThreshold = 95
              @Volatile var holdDurationMs = 20000L
              @Volatile var isPaused = true

              const val TAP_MS = 18L

              @Volatile var screenW = 0
              @Volatile var screenH = 0
          }
          EOF

          # 2. FlightLog.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/FlightLog.kt
          package com.example.tilebot

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.ConcurrentLinkedDeque

          object FlightLog {
              private const val MAX_ENTRIES = 120
              private val logs = ConcurrentLinkedDeque<String>()
              private val sdf = SimpleDateFormat("HH:mm:ss.SSS", Locale.US)

              fun log(tag: String, msg: String) {
                  val timeStr = sdf.format(Date())
                  logs.addLast("$timeStr | [$tag] $msg")
                  while (logs.size > MAX_ENTRIES) logs.pollFirst()
              }

              fun dump(): String {
                  if (logs.isEmpty()) return "No logs recorded yet."
                  val sb = StringBuilder()
                  sb.append("=== TILEBOT FLIGHT RECORDER (Last ").append(logs.size).append(" events) ===\n")
                  for (entry in logs) sb.append(entry).append("\n")
                  sb.append("=== END OF LOG ===\n")
                  return sb.toString()
              }
          }
          EOF

          # 3. TileDetector.kt - Early top-edge slider release (trigY - 18) + black leading-edge trigger at trigY
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/TileDetector.kt
          package com.example.tilebot

          import android.media.Image
          import android.os.SystemClock

          class TileDetector {
              private enum class S { IDLE, TAPPED, HOLD }

              private val state = Array(Config.LANES) { S.IDLE }
              private val t0 = LongArray(Config.LANES)
              private val cooldownUntil = LongArray(Config.LANES)
              private val seenBlueInHold = BooleanArray(Config.LANES)

              fun resetAll() {
                  for (i in 0 until Config.LANES) {
                      state[i] = S.IDLE
                      cooldownUntil[i] = 0L
                      seenBlueInHold[i] = false
                  }
              }

              fun process(img: Image) {
                  if (Config.isPaused) {
                      resetAll()
                      return
                  }
                  val now = SystemClock.uptimeMillis()
                  val svc = TapService.instance ?: return

                  val plane = img.planes[0]
                  val buf = plane.buffer
                  val rs = plane.rowStride
                  val ps = plane.pixelStride
                  val w = img.width
                  val h = img.height
                  val laneW = w / Config.LANES
                  val trigY = (h * Config.triggerFrac).toInt().coerceIn(28, h - 20)
                  // Release line 18 downscaled pixels (72 screen px) above trigY:
                  // When a slider's top edge reaches releaseY, its white completion dot is already well past trigY,
                  // and releasing here gives a natural ~40ms (2-3 frame) finger-up gap before a flush same-column tile hits trigY!
                  val releaseY = (trigY - 18).coerceAtLeast(10)
                  val thr = Config.darkThreshold

                  fun dark(x: Int, y: Int): Boolean {
                      val cy = y.coerceIn(0, h - 1)
                      val o = cy * rs + x * ps
                      if (o + 2 >= buf.limit()) return false
                      val r = buf.get(o).toInt() and 255
                      val g = buf.get(o + 1).toInt() and 255
                      val b = buf.get(o + 2).toInt() and 255
                      // Exclude faded translucent purple tiles (already-tapped black tiles have R>75, B>125)
                      if (r > 75 && b > 125) return false
                      return (r + g + b) / 3 < thr || r < 48
                  }

                  fun laneDark(l: Int, y: Int): Boolean {
                      val cx = (w * Config.laneFractions[l]).toInt()
                      val d = (laneW / 6).coerceAtLeast(3)
                      var c = 0
                      if (dark(cx, y)) c++
                      if (dark(cx - d, y)) c++
                      if (dark(cx + d, y)) c++
                      return c >= 2
                  }

                  // Checks outer lane points (cx - d, cx + d) away from the center cyan start-circle:
                  // Returns true ONLY inside the royal-blue / cyan body & top cap of a slider,
                  // and false on both short black tiles AND the dark-black bottom 20% of a new slider!
                  fun laneIsSliderBlue(l: Int, y: Int): Boolean {
                      val cy = y.coerceIn(0, h - 1)
                      val cx = (w * Config.laneFractions[l]).toInt()
                      val d = (laneW / 4).coerceAtLeast(4)
                      val o1 = cy * rs + (cx - d) * ps
                      val o2 = cy * rs + (cx + d) * ps
                      if (o2 + 2 >= buf.limit() || o1 < 0) return false
                      val r1 = buf.get(o1).toInt() and 255
                      val g1 = buf.get(o1 + 1).toInt() and 255
                      val b1 = buf.get(o1 + 2).toInt() and 255
                      val r2 = buf.get(o2).toInt() and 255
                      val g2 = buf.get(o2 + 1).toInt() and 255
                      val b2 = buf.get(o2 + 2).toInt() and 255
                      val blue1 = b1 > 130 && g1 > 65 && (b1 - r1) > 55
                      val blue2 = b2 > 130 && g2 > 65 && (b2 - r2) > 55
                      return blue1 && blue2
                  }

                  fun hasLightGapAtTrigger(l: Int): Boolean {
                      var lightRun = 0
                      for (y in (trigY - 4)..(trigY + 4)) {
                          if (!laneDark(l, y)) {
                              if (++lightRun >= 2) return true
                          } else {
                              lightRun = 0
                          }
                      }
                      return false
                  }

                  fun isBlueSliderBody(l: Int, startY: Int, run: Int): Boolean {
                      if (run < 95) return false
                      val sampleY = (startY - (run * 0.55f).toInt()).coerceIn(4, h - 4)
                      return laneIsSliderBlue(l, sampleY)
                  }

                  // Stops at either a 2px light gap OR a Blue->Black boundary so flush same-column tiles never merge
                  fun runLengthFrom(l: Int, startY: Int): Int {
                      var y = startY
                      var top = startY
                      var gap = 0
                      var seenBlue = false
                      while (y >= 0) {
                          if (laneDark(l, y)) {
                              if (laneIsSliderBlue(l, y)) {
                                  seenBlue = true
                              } else if (seenBlue && !laneIsSliderBlue(l, y) && !laneIsSliderBlue(l, (y - 3).coerceAtLeast(0))) {
                                  // Reached the black bottom of a second tile stacked flush on top of this slider
                                  break
                              }
                              top = y
                              gap = 0
                          } else if (++gap >= 2) {
                              break
                          }
                          y--
                      }
                      return startY - top
                  }

                  val tileH = h / 4f
                  val minValidRun = (tileH * 0.42f).toInt().coerceAtLeast(35)
                  val sliderRun = (tileH * 0.95f).toInt().coerceIn(145, 162)
                  var anyNewHit = false
                  var anySliderCleared = false

                  fun triggerLane(l: Int, scanY: Int) {
                      val run = runLengthFrom(l, scanY)
                      if (run >= sliderRun || isBlueSliderBody(l, scanY, run)) {
                          state[l] = S.HOLD
                          t0[l] = now
                          seenBlueInHold[l] = false
                          val holdMs = Config.holdDurationMs
                          FlightLog.log("DET", "L$l HIT -> SLIDER (run=$run, hold=${holdMs}ms)")
                          svc.enqueueHold(l, holdMs)
                          anyNewHit = true
                      } else if (run >= minValidRun) {
                          state[l] = S.TAPPED
                          t0[l] = now
                          FlightLog.log("DET", "L$l HIT -> TAP (run=$run)")
                          svc.enqueueTap(l)
                          anyNewHit = true
                      }
                  }

                  // Pass 1: Check primary trigger line across all 4 lanes
                  for (l in 0 until Config.LANES) {
                      val isDarkAtTrig = laneDark(l, trigY)

                      when (state[l]) {
                          S.IDLE -> {
                              // Only trigger on the BLACK bottom leading edge of a new tile/slider (!laneIsSliderBlue),
                              // never on the trailing blue top cap of a slider that just released at releaseY!
                              if (now >= cooldownUntil[l] &&
                                  isDarkAtTrig &&
                                  laneDark(l, trigY - 8) &&
                                  !laneIsSliderBlue(l, trigY)
                              ) {
                                  triggerLane(l, trigY)
                              }
                          }
                          S.TAPPED -> {
                              if (now - t0[l] >= 25L && hasLightGapAtTrigger(l)) {
                                  state[l] = S.IDLE
                                  cooldownUntil[l] = now + 10L
                              } else if (now - t0[l] >= 260L) {
                                  state[l] = S.IDLE
                              }
                          }
                          S.HOLD -> {
                              if (!seenBlueInHold[l] && (laneIsSliderBlue(l, releaseY) || laneIsSliderBlue(l, trigY))) {
                                  seenBlueInHold[l] = true
                              }
                              // Check for slider end at releaseY (trigY - 18):
                              // Once the slider's blue body has been seen at releaseY, the instant releaseY is no longer slider-blue
                              // (because either empty background OR the black bottom of a flush follow-up tile has reached releaseY),
                              // release the hold immediately so the finger is completely UP for ~40ms before the next tile hits trigY!
                              val blueEndedAtReleaseLine = seenBlueInHold[l] &&
                                  (now - t0[l] >= 90L) &&
                                  !laneIsSliderBlue(l, releaseY) &&
                                  !laneIsSliderBlue(l, releaseY - 3)

                              val lightCleared = (now - t0[l] >= 40L) && (!laneDark(l, releaseY) && !laneDark(l, releaseY - 2))

                              if (blueEndedAtReleaseLine || lightCleared) {
                                  FlightLog.log("DET", "L$l SLIDER CLEARED")
                                  state[l] = S.IDLE
                                  cooldownUntil[l] = now + 15L
                                  anySliderCleared = true
                              }
                          }
                      }
                  }

                  // Pass 2: Companion chord / double-slider lookahead (within 10px above trigY)
                  if (anyNewHit) {
                      val companionY = trigY - 10
                      for (l in 0 until Config.LANES) {
                          if (state[l] == S.IDLE && now >= cooldownUntil[l]) {
                              if (laneDark(l, companionY) &&
                                  laneDark(l, companionY - 8) &&
                                  !laneIsSliderBlue(l, companionY)
                              ) {
                                  triggerLane(l, companionY)
                              }
                          }
                      }
                      svc.commitFrame()
                  } else if (anySliderCleared && state.none { it == S.HOLD }) {
                      // Lift the virtual finger immediately at releaseY (trigY - 18), giving 2-3 full 60fps frames
                      // of finger-up time before any flush follow-up tile in the same column reaches trigY!
                      svc.releaseHoldNow()
                  }
              }
          }
          EOF

          # 4. TapService.kt - Active hold release via overlay sink + simultaneous 18ms multi-touch chords
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/TapService.kt
          package com.example.tilebot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.util.concurrent.ConcurrentLinkedQueue
          import kotlin.math.abs

          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
              }

              private class Action(val lane: Int, val durationMs: Long, val isHold: Boolean)

              private val mainHandler = Handler(Looper.getMainLooper())
              private val queue = ConcurrentLinkedQueue<Action>()

              private var tapInFlight = false
              private var holdInFlight = false
              private var activeHoldMask = 0
              private var activeGestureId = 0

              private var wm: WindowManager? = null
              private var overlayContainer: LinearLayout? = null
              private var btnToggle: TextView? = null
              private var touchSinkView: View? = null

              override fun onServiceConnected() {
                  instance = this
                  FlightLog.log("SYS", "TapService connected")
                  createFloatingUI()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  FlightLog.log("SYS", "TapService disconnected")
                  removeFloatingUI()
                  instance = null
                  return super.onUnbind(intent)
              }

              private fun createFloatingUI() {
                  if (overlayContainer != null) return
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 24
                      y = 75
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(8, 8, 8, 8)
                  }

                  val toggle = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setPadding(28, 18, 28, 18)
                  }
                  btnToggle = toggle
                  updateButtonAppearance()

                  val copyBtn = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      text = "📋 LOG"
                      setPadding(24, 18, 24, 18)
                      background = GradientDrawable().apply {
                          cornerRadius = 36f
                          setColor(Color.parseColor("#CC374151"))
                          setStroke(2, Color.WHITE)
                      }
                      setOnClickListener {
                          val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("TileBotLog", FlightLog.dump()))
                          Toast.makeText(this@TapService, "Debug Log Copied!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val spacer = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(24, 36)
                      setOnTouchListener { _, _ -> true }
                  }
                  touchSinkView = spacer

                  container.addView(toggle)
                  container.addView(spacer)
                  container.addView(copyBtn)

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f

                  toggle.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (event.rawX - touchX).toInt()
                              params.y = startY + (event.rawY - touchY).toInt()
                              wm?.updateViewLayout(overlayContainer, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (abs(event.rawX - touchX) < 15 && abs(event.rawY - touchY) < 15) {
                                  Config.isPaused = !Config.isPaused
                                  if (Config.isPaused) releaseAll()
                                  FlightLog.log("SYS", "Bot toggled: ${if (Config.isPaused) "PAUSED" else "RUNNING"}")
                                  updateButtonAppearance()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  wm?.addView(container, params)
                  overlayContainer = container
              }

              fun refreshButton() {
                  mainHandler.post { updateButtonAppearance() }
              }

              private fun updateButtonAppearance() {
                  btnToggle?.let { btn ->
                      val bg = GradientDrawable().apply {
                          cornerRadius = 36f
                          setColor(if (Config.isPaused) Color.parseColor("#CC1F2937") else Color.parseColor("#CC10B981"))
                          setStroke(2, Color.WHITE)
                      }
                      btn.background = bg
                      btn.text = if (Config.isPaused) "▶ BOT: PAUSED" else "⏸ BOT: ON"
                  }
              }

              private fun removeFloatingUI() {
                  overlayContainer?.let {
                      try { wm?.removeView(it) } catch (_: Exception) {}
                  }
                  overlayContainer = null
                  btnToggle = null
                  touchSinkView = null
              }

              fun enqueueTap(lane: Int) {
                  if (Config.isPaused) return
                  queue.add(Action(lane, Config.TAP_MS, false))
              }

              fun enqueueHold(lane: Int, durationMs: Long) {
                  if (Config.isPaused) return
                  queue.add(Action(lane, durationMs, true))
              }

              fun commitFrame() {
                  if (Config.isPaused) return
                  mainHandler.post { pump() }
              }

              fun releaseHoldNow() {
                  if (Config.isPaused) return
                  mainHandler.post {
                      if (!holdInFlight || !queue.isEmpty()) return@post
                      val sink = touchSinkView
                      val loc = IntArray(2)
                      if (sink != null) {
                          sink.getLocationOnScreen(loc)
                      }
                      val rx = if (loc[0] > 0) loc[0] + sink!!.width / 2f else 140f
                      val ry = if (loc[1] > 0) loc[1] + sink!!.height / 2f else 95f
                      val p = Path().apply {
                          moveTo(rx, ry)
                          lineTo(rx, ry)
                      }
                      val g = GestureDescription.Builder()
                          .addStroke(StrokeDescription(p, 0L, 1L, false))
                          .build()
                      val myId = ++activeGestureId
                      holdInFlight = false
                      tapInFlight = false
                      activeHoldMask = 0
                      dispatchGesture(g, object : GestureResultCallback() {
                          override fun onCompleted(d: GestureDescription?) {
                              if (myId != activeGestureId) return
                              pump()
                          }
                          override fun onCancelled(d: GestureDescription?) {
                              if (myId != activeGestureId) return
                              pump()
                          }
                      }, null)
                  }
              }

              fun releaseAll() {
                  queue.clear()
                  tapInFlight = false
                  holdInFlight = false
                  activeHoldMask = 0
              }

              private fun pump() {
                  if (Config.isPaused) {
                      queue.clear()
                      tapInFlight = false
                      holdInFlight = false
                      activeHoldMask = 0
                      return
                  }
                  if (tapInFlight) return
                  val first = queue.peek() ?: return

                  val strokes = ArrayList<StrokeDescription>()
                  val used = HashSet<Int>()
                  var stagger = 0L
                  var hasHold = false
                  var newHoldMask = 0

                  if (holdInFlight) {
                      stagger = 10L
                  }

                  while (true) {
                      val a = queue.peek() ?: break
                      if (a.lane in used) break
                      if (strokes.isNotEmpty() && (a.isHold != hasHold)) break
                      queue.poll()

                      val x = Config.screenW * Config.laneFractions[a.lane]
                      val y = Config.screenH * Config.triggerFrac
                      val p = Path().apply {
                          moveTo(x, y)
                          if (a.isHold) lineTo(x, y + 4f) else lineTo(x, y)
                      }

                      val safeDuration = if (a.isHold) a.durationMs.coerceIn(10L, 55000L) else a.durationMs.coerceIn(14L, 22L)
                      strokes.add(StrokeDescription(p, stagger, safeDuration, false))
                      if (a.isHold) {
                          hasHold = true
                          newHoldMask = newHoldMask or (1 shl a.lane)
                          FlightLog.log("TOUCH", "L${a.lane} FULL HOLD (${safeDuration}ms, offset=${stagger}ms)")
                      } else {
                          FlightLog.log("TOUCH", "L${a.lane} TAP (${safeDuration}ms, offset=${stagger}ms)")
                      }
                      stagger += 2L
                      used.add(a.lane)
                  }

                  if (strokes.isEmpty()) return

                  val g = GestureDescription.Builder().apply {
                      strokes.forEach { addStroke(it) }
                  }.build()

                  val myId = ++activeGestureId
                  if (hasHold) {
                      holdInFlight = true
                      tapInFlight = false
                      activeHoldMask = newHoldMask
                  } else {
                      tapInFlight = true
                      holdInFlight = false
                      activeHoldMask = 0
                  }

                  val sent = dispatchGesture(g, object : GestureResultCallback() {
                      override fun onCompleted(d: GestureDescription?) {
                          if (myId != activeGestureId) return
                          tapInFlight = false
                          holdInFlight = false
                          activeHoldMask = 0
                          pump()
                      }

                      override fun onCancelled(d: GestureDescription?) {
                          if (myId != activeGestureId) return
                          FlightLog.log("WARN", "Gesture CANCELLED by OS")
                          tapInFlight = false
                          holdInFlight = false
                          activeHoldMask = 0
                          pump()
                      }
                  }, null)

                  if (!sent) {
                      FlightLog.log("ERROR", "dispatchGesture returned FALSE")
                      if (myId == activeGestureId) {
                          tapInFlight = false
                          holdInFlight = false
                          activeHoldMask = 0
                      }
                      mainHandler.postDelayed({ pump() }, 6L)
                  }
              }
          }
          EOF

          # 5. MainActivity.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/MainActivity.kt
          package com.example.tilebot

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          class MainActivity : ComponentActivity() {

              private val prefs by lazy { getSharedPreferences("cfg", MODE_PRIVATE) }

              private val projLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val data = r.data
                  if (r.resultCode == RESULT_OK && data != null) {
                      Config.isPaused = true
                      TapService.instance?.refreshButton()
                      startForegroundService(
                          Intent(this, CaptureService::class.java).putExtra("code", r.resultCode).putExtra("data", data)
                      )
                      Toast.makeText(this, "Capture started! Open Piano Tiles and tap the floating button.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }
              }

              private val notifLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { launchCapture() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Config.triggerFrac = prefs.getInt("trig", 65) / 100f
                  Config.darkThreshold = prefs.getInt("dark", 95)
                  Config.holdDurationMs = prefs.getInt("slider_hold_v6", 20000).toLong()

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad * 2, pad, pad) }

                  root.addView(TextView(this).apply {
                      text = "1. Enable TileBot Accessibility Service.\n" +
                          "2. Tap Start Capture and choose \"Entire screen\".\n" +
                          "3. Open the game, toggle BOT: ON, and tap Play!"
                  })
                  root.addView(Button(this).apply {
                      text = "1. Open accessibility settings"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(Button(this).apply { text = "2. Start Capture"; setOnClickListener { startBot() } })
                  root.addView(Button(this).apply {
                      text = "Stop Capture"
                      setOnClickListener {
                          Config.isPaused = true
                          TapService.instance?.refreshButton()
                          stopService(Intent(this@MainActivity, CaptureService::class.java))
                      }
                  })

                  slider(root, "Trigger line (% of height)", 40, 85, (Config.triggerFrac * 100).toInt()) {
                      Config.triggerFrac = it / 100f; prefs.edit().putInt("trig", it).apply()
                  }
                  slider(root, "Dark threshold (Default 95)", 40, 150, Config.darkThreshold) {
                      Config.darkThreshold = it; prefs.edit().putInt("dark", it).apply()
                  }
                  slider(root, "Max slider hold ms (Default 20000)", 5000, 30000, Config.holdDurationMs.toInt()) {
                      Config.holdDurationMs = it.toLong(); prefs.edit().putInt("slider_hold_v6", it).apply()
                  }
                  setContentView(root)
              }

              private fun startBot() {
                  if (TapService.instance == null) {
                      Toast.makeText(this, "Enable the accessibility service first", Toast.LENGTH_LONG).show(); return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS) else launchCapture()
              }

              private fun launchCapture() {
                  val mgr = getSystemService(MediaProjectionManager::class.java)
                  projLauncher.launch(mgr.createScreenCaptureIntent())
              }

              private fun slider(root: LinearLayout, label: String, min: Int, max: Int, init: Int, on: (Int) -> Unit) {
                  val tv = TextView(this).apply { text = "$label: $init"; setPadding(0, 32, 0, 0) }
                  val sb = SeekBar(this).apply {
                      this.max = max - min
                      progress = init - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                              tv.text = "$label: ${p + min}"; on(p + min)
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  root.addView(tv); root.addView(sb)
              }
          }
          EOF

          # 6. CaptureService buffer count
          sed -i 's/PixelFormat.RGBA_8888, 2/PixelFormat.RGBA_8888, 4/g' TileBot/app/src/main/java/com/example/tilebot/CaptureService.kt

