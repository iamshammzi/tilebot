name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip and patch project
        run: |
          if [ -f TileBot.zip ]; then
            unzip -q -o TileBot.zip
          fi

          echo "android.useAndroidX=true" >> TileBot/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> TileBot/gradle.properties

          # 1. Config.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/Config.kt
          package com.example.tilebot

          object Config {
              const val LANES = 4
              const val SCALE = 8

              val laneFractions = floatArrayOf(0.125f, 0.375f, 0.625f, 0.875f)

              @Volatile var triggerFrac = 0.62f
              @Volatile var darkThreshold = 52
              @Volatile var holdDurationMs = 12000L
              @Volatile var isPaused = true

              const val TAP_MS = 16L

              @Volatile var screenW = 0
              @Volatile var screenH = 0
          }
          EOF

          # 2. FlightLog.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/FlightLog.kt
          package com.example.tilebot

          import android.os.SystemClock
          import java.util.concurrent.ConcurrentLinkedDeque

          object FlightLog {
              private const val MAX_ENTRIES = 120
              private val logs = ConcurrentLinkedDeque<String>()

              fun log(tag: String, msg: String) {
                  val ms = SystemClock.uptimeMillis()
                  val sec = (ms / 1000) % 1000
                  val rem = ms % 1000
                  logs.addLast("${sec}.${rem.toString().padStart(3, '0')}s | [$tag] $msg")
                  while (logs.size > MAX_ENTRIES) logs.pollFirst()
              }

              fun dump(): String {
                  if (logs.isEmpty()) return "No logs recorded yet."
                  val sb = StringBuilder()
                  sb.append("=== TILEBOT FLIGHT RECORDER (Last ").append(logs.size).append(" events) ===\n")
                  for (entry in logs) sb.append(entry).append("\n")
                  sb.append("=== END OF LOG ===\n")
                  return sb.toString()
              }
          }
          EOF

          # 3. TileDetector.kt - Requires hasBlueSliderBody for sliders so stacked black tiles (run=130) are ALWAYS tapped!
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/TileDetector.kt
          package com.example.tilebot

          import android.media.Image
          import android.os.Process
          import android.os.SystemClock

          class TileDetector {
              private enum class S { IDLE, TAPPED, HOLD }

              private val state = Array(Config.LANES) { S.IDLE }
              private val t0 = LongArray(Config.LANES)
              private val cooldownUntil = LongArray(Config.LANES)
              private val seenBlueInHold = BooleanArray(Config.LANES)

              private var lastTapHitTime = 0L
              private var beatMs = 200f
              private var lastFrameTime = 0L
              private var prioritySet = false
              private var playfieldActiveSince = 0L
              private var hadFirstHitInMatch = false

              fun resetAll() {
                  for (i in 0 until Config.LANES) {
                      state[i] = S.IDLE
                      cooldownUntil[i] = 0L
                      seenBlueInHold[i] = false
                  }
                  lastTapHitTime = 0L
                  beatMs = 200f
                  playfieldActiveSince = 0L
                  hadFirstHitInMatch = false
              }

              fun process(img: Image) {
                  if (!prioritySet) {
                      Process.setThreadPriority(Process.THREAD_PRIORITY_BACKGROUND)
                      prioritySet = true
                  }
                  if (Config.isPaused) {
                      resetAll()
                      return
                  }
                  val now = SystemClock.uptimeMillis()
                  if (now - lastFrameTime < 14L) return
                  lastFrameTime = now

                  val svc = TapService.instance ?: return

                  val plane = img.planes[0]
                  val buf = plane.buffer
                  val rs = plane.rowStride
                  val ps = plane.pixelStride
                  val w = img.width
                  val h = img.height
                  val laneW = w / Config.LANES
                  val trigY = (h * Config.triggerFrac).toInt().coerceIn(16, h - 12)
                  val flushReleaseY = (trigY - 8).coerceAtLeast(6)
                  val rThr = Config.darkThreshold.coerceIn(38, 75)

                  fun dark(x: Int, y: Int): Boolean {
                      val cy = y.coerceIn(0, h - 1)
                      val o = cy * rs + x * ps
                      if (o + 2 >= buf.limit()) return false
                      val r = buf.get(o).toInt() and 255
                      val g = buf.get(o + 1).toInt() and 255
                      val b = buf.get(o + 2).toInt() and 255
                      if (r < rThr) {
                          val isBlackOrDarkGrad = g < 75 && b < 115
                          val isRoyalBlue = b >= 95 && (b - r) > 38
                          if (isBlackOrDarkGrad || isRoyalBlue) return true
                      }
                      return r < 135 && g > 170 && b > 210 && (b - r) > 80
                  }

                  fun isBrightPlayfieldBg(l: Int, y: Int): Boolean {
                      val cy = y.coerceIn(0, h - 1)
                      val cx = (w * Config.laneFractions[l]).toInt()
                      val o = cy * rs + cx * ps
                      if (o + 2 >= buf.limit()) return false
                      val r = buf.get(o).toInt() and 255
                      val g = buf.get(o + 1).toInt() and 255
                      val b = buf.get(o + 2).toInt() and 255
                      return r > 105 && g > 85 && b > 145
                  }

                  var bgLanes = 0
                  for (l in 0 until Config.LANES) {
                      if (isBrightPlayfieldBg(l, trigY) || isBrightPlayfieldBg(l, trigY - 12)) {
                          bgLanes++
                      }
                  }
                  if (bgLanes < 2) {
                      if (playfieldActiveSince != 0L) {
                          resetAll()
                          svc.releaseAll()
                      }
                      return
                  }
                  if (playfieldActiveSince == 0L) {
                      playfieldActiveSince = now
                      hadFirstHitInMatch = false
                  }

                  fun laneDark(l: Int, y: Int): Boolean {
                      val cx = (w * Config.laneFractions[l]).toInt()
                      val d = (laneW / 6).coerceAtLeast(2)
                      var c = 0
                      if (dark(cx, y)) c++
                      if (dark(cx - d, y)) c++
                      if (dark(cx + d, y)) c++
                      return c >= 2
                  }

                  fun laneIsSliderBlue(l: Int, y: Int): Boolean {
                      val cy = y.coerceIn(0, h - 1)
                      val cx = (w * Config.laneFractions[l]).toInt()
                      val d = (laneW / 4).coerceAtLeast(2)
                      val o1 = cy * rs + (cx - d) * ps
                      val o2 = cy * rs + (cx + d) * ps
                      if (o2 + 2 >= buf.limit() || o1 < 0) return false
                      val r1 = buf.get(o1).toInt() and 255
                      val g1 = buf.get(o1 + 1).toInt() and 255
                      val b1 = buf.get(o1 + 2).toInt() and 255
                      val r2 = buf.get(o2).toInt() and 255
                      val g2 = buf.get(o2 + 1).toInt() and 255
                      val b2 = buf.get(o2 + 2).toInt() and 255
                      val blue1 = r1 < 140 && b1 >= 112 && g1 >= 55 && (b1 - r1) > 42
                      val blue2 = r2 < 140 && b2 >= 112 && g2 >= 55 && (b2 - r2) > 42
                      return blue1 && blue2
                  }

                  // Verifies that the tile actually contains royal-blue / cyan slider body pixels!
                  // Two stacked black tap tiles in the same column have run ~ 130, but 0 blue rows -> returns FALSE!
                  fun hasBlueSliderBody(l: Int, startY: Int, run: Int): Boolean {
                      if (run < 50) return false
                      val topScan = (startY - run + 4).coerceAtLeast(2)
                      val botScan = (startY - 10).coerceAtLeast(topScan)
                      var blueRows = 0
                      var y = botScan
                      while (y >= topScan) {
                          if (laneIsSliderBlue(l, y)) {
                              if (++blueRows >= 5) return true
                          }
                          y -= 2
                      }
                      return false
                  }

                  fun runLengthFrom(l: Int, startY: Int): Int {
                      var y = startY
                      var top = startY
                      var gap = 0
                      var seenBlue = false
                      while (y >= 0) {
                          if (laneDark(l, y)) {
                              if (laneIsSliderBlue(l, y)) {
                                  seenBlue = true
                              } else if (seenBlue && !laneIsSliderBlue(l, (y - 2).coerceAtLeast(0))) {
                                  break
                              }
                              top = y
                              gap = 0
                          } else if (++gap >= 2) {
                              break
                          }
                          y--
                      }
                      return startY - top
                  }

                  // At SCALE = 8, h is ~300, 1 black tap tile is ~64px.
                  // Setting minValidRun = 42 prevents double-tapping a single black tile (run <= 39 after 0.65 * beatMs),
                  // while guaranteeing a stacked 2nd black tile in the same column (run ~ 64 >= 42) is always tapped!
                  val tileH = h / 4.5f
                  val minValidRun = (tileH * 0.62f).toInt().coerceIn(40, 48)
                  val minSliderRun = (tileH * 1.10f).toInt().coerceIn(68, 80)
                  var anyNewHit = false
                  var anyFlushSliderRelease = false
                  var tapsThisFrame = 0

                  fun triggerLane(l: Int, scanY: Int, customTouchFrac: Float = Config.triggerFrac) {
                      val run = runLengthFrom(l, scanY)
                      // A tile is a SLIDER if and only if it is tall enough AND has a blue slider body!
                      // Stacked black tiles (run = 130, hasBlueSliderBody = false) will now be tapped as TAPs!
                      if (run >= minSliderRun && hasBlueSliderBody(l, scanY, run)) {
                          state[l] = S.HOLD
                          t0[l] = now
                          seenBlueInHold[l] = false
                          hadFirstHitInMatch = true
                          val holdMs = Config.holdDurationMs
                          FlightLog.log("DET", "L$l HIT -> SLIDER (run=$run)")
                          svc.enqueueHold(l, holdMs, customTouchFrac)
                          anyNewHit = true
                      } else if (run >= minValidRun) {
                          if (tapsThisFrame == 0) {
                              val dt = now - lastTapHitTime
                              if (dt in 125L..400L) {
                                  beatMs = (beatMs * 0.65f + dt * 0.35f).coerceIn(135f, 320f)
                              }
                              lastTapHitTime = now
                          }
                          state[l] = S.TAPPED
                          t0[l] = now
                          hadFirstHitInMatch = true
                          val yFrac = if (tapsThisFrame > 0) (customTouchFrac + 0.025f).coerceAtMost(0.85f) else customTouchFrac
                          tapsThisFrame++
                          FlightLog.log("DET", "L$l HIT -> TAP (run=$run)")
                          svc.enqueueTap(l, yFrac)
                          anyNewHit = true
                      }
                  }

                  val maxTapLockMs = (beatMs * 0.64f).toLong().coerceIn(90L, 175L)

                  if (!hadFirstHitInMatch && (now - playfieldActiveSince <= 2500L)) {
                      val lateY = (h * 0.82f).toInt()
                      for (l in 0 until Config.LANES) {
                          if (state[l] == S.IDLE && laneDark(l, lateY) && laneDark(l, lateY - 6)) {
                              triggerLane(l, lateY, 0.82f)
                          }
                      }
                      if (anyNewHit) {
                          svc.commitFrame()
                          return
                      }
                  }

                  // Pass 1: Check primary trigger line across all 4 lanes
                  for (l in 0 until Config.LANES) {
                      val isDarkAtTrig = laneDark(l, trigY)

                      when (state[l]) {
                          S.IDLE -> {
                              if (now >= cooldownUntil[l] &&
                                  isDarkAtTrig &&
                                  laneDark(l, trigY - 4) &&
                                  !laneIsSliderBlue(l, trigY)
                              ) {
                                  triggerLane(l, trigY)
                              }
                          }
                          S.TAPPED -> {
                              val elapsed = now - t0[l]
                              // Only check trigY and trigY - 4 (never below trigY!) so empty space below a newly
                              // entering tile never causes a premature reset at 20ms!
                              val bodyCleared = elapsed >= 35L && !isDarkAtTrig && !laneDark(l, trigY - 4)
                              if (bodyCleared) {
                                  state[l] = S.IDLE
                                  cooldownUntil[l] = now + 8L
                              } else if (elapsed >= maxTapLockMs) {
                                  // Unlock at 64% of 1 beat: if a 2nd black tile is stacked flush on top of Tile #1
                                  // in the same column, its remaining run is >= 64px (>= minValidRun=42) -> triggers immediately!
                                  // If no 2nd tile is stacked, Tile #1 has <= 24px left (< minValidRun=42) -> ignored!
                                  state[l] = S.IDLE
                                  if (isDarkAtTrig && laneDark(l, trigY - 4) && !laneIsSliderBlue(l, trigY)) {
                                      triggerLane(l, trigY)
                                  }
                              }
                          }
                          S.HOLD -> {
                              if (!seenBlueInHold[l] && (laneIsSliderBlue(l, flushReleaseY) || laneIsSliderBlue(l, trigY))) {
                                  seenBlueInHold[l] = true
                              }
                              val flushBlackAbove = seenBlueInHold[l] &&
                                  (now - t0[l] >= 90L) &&
                                  laneDark(l, flushReleaseY) &&
                                  !laneIsSliderBlue(l, flushReleaseY) &&
                                  laneDark(l, (flushReleaseY - 2).coerceAtLeast(0)) &&
                                  !laneIsSliderBlue(l, (flushReleaseY - 2).coerceAtLeast(0))

                              val normalTailCleared = (now - t0[l] >= 60L) &&
                                  !laneDark(l, trigY) &&
                                  !laneDark(l, (trigY + 3).coerceAtMost(h - 2))

                              if (flushBlackAbove) {
                                  FlightLog.log("DET", "L$l SLIDER CLEARED (FLUSH)")
                                  state[l] = S.IDLE
                                  cooldownUntil[l] = now + 8L
                                  anyFlushSliderRelease = true
                              } else if (normalTailCleared) {
                                  FlightLog.log("DET", "L$l SLIDER CLEARED")
                                  state[l] = S.IDLE
                                  cooldownUntil[l] = now + 8L
                              }
                          }
                      }
                  }

                  // Pass 2: Companion chord / double-slider lookahead (within 5px above trigY at SCALE=8)
                  if (anyNewHit) {
                      val companionY = trigY - 5
                      for (l in 0 until Config.LANES) {
                          if (state[l] == S.IDLE && now >= cooldownUntil[l]) {
                              if (laneDark(l, companionY) &&
                                  laneDark(l, companionY - 4) &&
                                  !laneIsSliderBlue(l, companionY)
                              ) {
                                  triggerLane(l, companionY)
                              }
                          }
                      }
                      svc.commitFrame()
                  } else if (anyFlushSliderRelease && state.none { it == S.HOLD }) {
                      svc.releaseHoldNow()
                  }
              }
          }
          EOF

          # 4. TapService.kt - 120Hz preferredRefreshRate overlay + opaque rendering + low-overhead gestures
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/TapService.kt
          package com.example.tilebot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.util.concurrent.ConcurrentLinkedQueue
          import kotlin.math.abs

          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
              }

              private class Action(val lane: Int, val durationMs: Long, val isHold: Boolean, val yFrac: Float)

              private val mainHandler = Handler(Looper.getMainLooper())
              private val queue = ConcurrentLinkedQueue<Action>()

              private var tapInFlight = false
              private var holdInFlight = false
              private var activeHoldMask = 0
              private var activeGestureId = 0

              private var wm: WindowManager? = null
              private var overlayContainer: LinearLayout? = null
              private var btnToggle: TextView? = null
              private var touchSinkView: View? = null

              override fun onServiceConnected() {
                  instance = this
                  FlightLog.log("SYS", "TapService connected")
                  createFloatingUI()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  FlightLog.log("SYS", "TapService disconnected")
                  removeFloatingUI()
                  instance = null
                  return super.onUnbind(intent)
              }

              private fun createFloatingUI() {
                  if (overlayContainer != null) return
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 24
                      y = 75
                      preferredRefreshRate = 120f
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(8, 8, 8, 8)
                  }

                  val toggle = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setPadding(28, 18, 28, 18)
                  }
                  btnToggle = toggle
                  updateButtonAppearance()

                  val copyBtn = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      text = "📋 LOG"
                      setPadding(24, 18, 24, 18)
                      background = GradientDrawable().apply {
                          cornerRadius = 36f
                          setColor(Color.parseColor("#FF374151"))
                          setStroke(2, Color.WHITE)
                      }
                      setOnClickListener {
                          val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("TileBotLog", FlightLog.dump()))
                          Toast.makeText(this@TapService, "Debug Log Copied!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val spacer = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(24, 36)
                      setOnTouchListener { _, _ -> true }
                  }
                  touchSinkView = spacer

                  container.addView(toggle)
                  container.addView(spacer)
                  container.addView(copyBtn)

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f

                  toggle.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (event.rawX - touchX).toInt()
                              params.y = startY + (event.rawY - touchY).toInt()
                              wm?.updateViewLayout(overlayContainer, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (abs(event.rawX - touchX) < 15 && abs(event.rawY - touchY) < 15) {
                                  Config.isPaused = !Config.isPaused
                                  if (Config.isPaused) releaseAll()
                                  FlightLog.log("SYS", "Bot toggled: ${if (Config.isPaused) "PAUSED" else "RUNNING"}")
                                  updateButtonAppearance()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  wm?.addView(container, params)
                  overlayContainer = container
              }

              fun refreshButton() {
                  mainHandler.post { updateButtonAppearance() }
              }

              private fun updateButtonAppearance() {
                  btnToggle?.let { btn ->
                      val bg = GradientDrawable().apply {
                          cornerRadius = 36f
                          setColor(if (Config.isPaused) Color.parseColor("#FF1F2937") else Color.parseColor("#FF10B981"))
                          setStroke(2, Color.WHITE)
                      }
                      btn.background = bg
                      btn.text = if (Config.isPaused) "▶ BOT: PAUSED" else "⏸ BOT: ON"
                  }
              }

              private fun removeFloatingUI() {
                  overlayContainer?.let {
                      try { wm?.removeView(it) } catch (_: Exception) {}
                  }
                  overlayContainer = null
                  btnToggle = null
                  touchSinkView = null
              }

              fun enqueueTap(lane: Int, yFrac: Float = Config.triggerFrac) {
                  if (Config.isPaused) return
                  queue.add(Action(lane, Config.TAP_MS, false, yFrac))
              }

              fun enqueueHold(lane: Int, durationMs: Long, yFrac: Float = Config.triggerFrac) {
                  if (Config.isPaused) return
                  queue.add(Action(lane, durationMs, true, yFrac))
              }

              fun commitFrame() {
                  if (Config.isPaused) return
                  mainHandler.post { pump() }
              }

              fun releaseHoldNow() {
                  if (Config.isPaused) return
                  mainHandler.post {
                      if (!holdInFlight || !queue.isEmpty()) return@post
                      val sink = touchSinkView
                      val loc = IntArray(2)
                      if (sink != null) {
                          sink.getLocationOnScreen(loc)
                      }
                      val rx = if (loc[0] > 0) loc[0] + sink!!.width / 2f else 140f
                      val ry = if (loc[1] > 0) loc[1] + sink!!.height / 2f else 95f
                      val p = Path().apply {
                          moveTo(rx, ry)
                          lineTo(rx, ry)
                      }
                      val g = GestureDescription.Builder()
                          .addStroke(StrokeDescription(p, 0L, 1L, false))
                          .build()
                      val myId = ++activeGestureId
                      holdInFlight = false
                      tapInFlight = false
                      activeHoldMask = 0
                      dispatchGesture(g, object : GestureResultCallback() {
                          override fun onCompleted(d: GestureDescription?) {
                              if (myId != activeGestureId) return
                              pump()
                          }
                          override fun onCancelled(d: GestureDescription?) {
                              if (myId != activeGestureId) return
                              pump()
                          }
                      }, null)
                  }
              }

              fun releaseAll() {
                  queue.clear()
                  tapInFlight = false
                  holdInFlight = false
                  activeHoldMask = 0
              }

              private fun pump() {
                  if (Config.isPaused) {
                      queue.clear()
                      tapInFlight = false
                      holdInFlight = false
                      activeHoldMask = 0
                      return
                  }
                  if (tapInFlight) return
                  val first = queue.peek() ?: return

                  val strokes = ArrayList<StrokeDescription>()
                  val used = HashSet<Int>()
                  var stagger = 0L
                  var hasHold = false
                  var newHoldMask = 0

                  if (holdInFlight && ((activeHoldMask and (1 shl first.lane)) != 0)) {
                      stagger = 10L
                  }

                  if (!first.isHold) {
                      val a = queue.poll() ?: return
                      val x = Config.screenW * Config.laneFractions[a.lane]
                      val y = Config.screenH * a.yFrac
                      val p = Path().apply {
                          moveTo(x, y)
                          lineTo(x, y)
                      }
                      val safeDuration = a.durationMs.coerceIn(14L, 20L)
                      strokes.add(StrokeDescription(p, stagger, safeDuration, false))
                      FlightLog.log("TOUCH", "L${a.lane} TAP (${safeDuration}ms)")
                  } else {
                      while (true) {
                          val a = queue.peek() ?: break
                          if (!a.isHold) break
                          if (a.lane in used) break
                          queue.poll()

                          val x = Config.screenW * Config.laneFractions[a.lane]
                          val y = Config.screenH * a.yFrac
                          val p = Path().apply {
                              moveTo(x, y)
                              lineTo(x, y)
                          }
                          val safeDuration = a.durationMs.coerceIn(10L, 55000L)
                          strokes.add(StrokeDescription(p, stagger, safeDuration, false))
                          hasHold = true
                          newHoldMask = newHoldMask or (1 shl a.lane)
                          FlightLog.log("TOUCH", "L${a.lane} HOLD (${safeDuration}ms)")
                          stagger += 2L
                          used.add(a.lane)
                      }
                  }

                  if (strokes.isEmpty()) return

                  val g = GestureDescription.Builder().apply {
                      strokes.forEach { addStroke(it) }
                  }.build()

                  val myId = ++activeGestureId
                  if (hasHold) {
                      holdInFlight = true
                      tapInFlight = false
                      activeHoldMask = newHoldMask
                  } else {
                      tapInFlight = true
                      holdInFlight = false
                      activeHoldMask = 0
                  }

                  val sent = dispatchGesture(g, object : GestureResultCallback() {
                      override fun onCompleted(d: GestureDescription?) {
                          if (myId != activeGestureId) return
                          holdInFlight = false
                          activeHoldMask = 0
                          if (!hasHold && !queue.isEmpty()) {
                              mainHandler.postDelayed({
                                  if (myId == activeGestureId) {
                                      tapInFlight = false
                                      pump()
                                  }
                              }, 10L)
                          } else {
                              tapInFlight = false
                              pump()
                          }
                      }

                      override fun onCancelled(d: GestureDescription?) {
                          if (myId != activeGestureId) return
                          tapInFlight = false
                          holdInFlight = false
                          activeHoldMask = 0
                          pump()
                      }
                  }, null)

                  if (!sent) {
                      if (myId == activeGestureId) {
                          tapInFlight = false
                          holdInFlight = false
                          activeHoldMask = 0
                      }
                      mainHandler.postDelayed({ pump() }, 6L)
                  }
              }
          }
          EOF

          # 5. MainActivity.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/MainActivity.kt
          package com.example.tilebot

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          class MainActivity : ComponentActivity() {

              private val prefs by lazy { getSharedPreferences("cfg", MODE_PRIVATE) }

              private val projLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val data = r.data
                  if (r.resultCode == RESULT_OK && data != null) {
                      Config.isPaused = true
                      TapService.instance?.refreshButton()
                      startForegroundService(
                          Intent(this, CaptureService::class.java).putExtra("code", r.resultCode).putExtra("data", data)
                      )
                      Toast.makeText(this, "Capture started! Open Piano Tiles and tap the floating button.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }
              }

              private val notifLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { launchCapture() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Config.triggerFrac = prefs.getInt("trig_v3", 62) / 100f
                  Config.darkThreshold = prefs.getInt("red_thr_v1", 52)
                  Config.holdDurationMs = prefs.getInt("slider_hold_v7", 12000).toLong()

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad * 2, pad, pad) }

                  root.addView(TextView(this).apply {
                      text = "1. Turn OFF Battery Saver & set Display Refresh Rate to 120Hz.\n" +
                          "2. Enable TileBot Accessibility Service & tap Start Capture.\n" +
                          "3. Open the game, toggle BOT: ON, and tap Play!"
                  })
                  root.addView(Button(this).apply {
                      text = "1. Open accessibility settings"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(Button(this).apply { text = "2. Start Capture"; setOnClickListener { startBot() } })
                  root.addView(Button(this).apply {
                      text = "Stop Capture"
                      setOnClickListener {
                          Config.isPaused = true
                          TapService.instance?.refreshButton()
                          stopService(Intent(this@MainActivity, CaptureService::class.java))
                      }
                  })

                  slider(root, "Trigger line (% of height, Default 62)", 40, 80, (Config.triggerFrac * 100).toInt()) {
                      Config.triggerFrac = it / 100f; prefs.edit().putInt("trig_v3", it).apply()
                  }
                  slider(root, "Red-channel tile threshold (Default 52)", 38, 75, Config.darkThreshold) {
                      Config.darkThreshold = it; prefs.edit().putInt("red_thr_v1", it).apply()
                  }
                  slider(root, "Max slider hold ms (Default 12000)", 5000, 25000, Config.holdDurationMs.toInt()) {
                      Config.holdDurationMs = it.toLong(); prefs.edit().putInt("slider_hold_v7", it).apply()
                  }
                  setContentView(root)
              }

              private fun startBot() {
                  if (TapService.instance == null) {
                      Toast.makeText(this, "Enable the accessibility service first", Toast.LENGTH_LONG).show(); return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS) else launchCapture()
              }

              private fun launchCapture() {
                  val mgr = getSystemService(MediaProjectionManager::class.java)
                  projLauncher.launch(mgr.createScreenCaptureIntent())
              }

              private fun slider(root: LinearLayout, label: String, min: Int, max: Int, init: Int, on: (Int) -> Unit) {
                  val tv = TextView(this).apply { text = "$label: $init"; setPadding(0, 32, 0, 0) }
                  val sb = SeekBar(this).apply {
                      this.max = max - min
                      progress = init - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                              tv.text = "$label: ${p + min}"; on(p + min)
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  root.addView(tv); root.addView(sb)
              }
          }
          EOF

          # 6. CaptureService buffer count
          sed -i 's/PixelFormat.RGBA_8888, 4/PixelFormat.RGBA_8888, 2/g' TileBot/app/src/main/java/com/example/tilebot/CaptureService.kt

