name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and patch project
        run: |
          if [ -f TileBot.zip ]; then
            unzip -q -o TileBot.zip
          fi
          echo "android.useAndroidX=true" >> TileBot/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> TileBot/gradle.properties

          # 1. Config.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/Config.kt
          package com.example.tilebot

          object Config {
              const val LANES = 4
              const val SCALE = 4

              val laneFractions = floatArrayOf(0.125f, 0.375f, 0.625f, 0.875f)

              @Volatile var triggerFrac = 0.65f
              @Volatile var darkThreshold = 95
              @Volatile var isPaused = true

              const val TAP_MS = 8L
              const val BURST_INTERVAL_MS = 16L

              @Volatile var screenW = 0
              @Volatile var screenH = 0
          }
          EOF

          # 2. FlightLog.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/FlightLog.kt
          package com.example.tilebot

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.ConcurrentLinkedDeque

          object FlightLog {
              private const val MAX_ENTRIES = 120
              private val logs = ConcurrentLinkedDeque<String>()
              private val sdf = SimpleDateFormat("HH:mm:ss.SSS", Locale.US)

              fun log(tag: String, msg: String) {
                  val timeStr = sdf.format(Date())
                  logs.addLast("$timeStr | [$tag] $msg")
                  while (logs.size > MAX_ENTRIES) logs.pollFirst()
              }

              fun dump(): String {
                  if (logs.isEmpty()) return "No logs recorded yet."
                  val sb = StringBuilder()
                  sb.append("=== TILEBOT FLIGHT RECORDER (Last ").append(logs.size).append(" events) ===\n")
                  for (entry in logs) sb.append(entry).append("\n")
                  sb.append("=== END OF LOG ===\n")
                  return sb.toString()
              }
          }
          EOF

          # 3. TileDetector.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/TileDetector.kt
          package com.example.tilebot

          import android.media.Image
          import android.os.SystemClock

          class TileDetector {
              private enum class S { IDLE, TAPPED, HOLD }

              private val state = Array(Config.LANES) { S.IDLE }
              private val t0 = LongArray(Config.LANES)
              private val lastBurstTime = LongArray(Config.LANES)
              private val holdMiss = IntArray(Config.LANES)

              fun resetAll() {
                  for (i in 0 until Config.LANES) state[i] = S.IDLE
              }

              fun process(img: Image) {
                  if (Config.isPaused) {
                      resetAll()
                      return
                  }
                  val now = SystemClock.uptimeMillis()
                  val svc = TapService.instance ?: return

                  val plane = img.planes[0]
                  val buf = plane.buffer
                  val rs = plane.rowStride
                  val ps = plane.pixelStride
                  val w = img.width
                  val h = img.height

                  val laneW = w / Config.LANES
                  val trigY = (h * Config.triggerFrac).toInt().coerceIn(4, h - 4)
                  val thr = Config.darkThreshold

                  fun dark(x: Int, y: Int): Boolean {
                      val o = y * rs + x * ps
                      if (o + 2 >= buf.limit()) return false
                      val r = buf.get(o).toInt() and 255
                      val g = buf.get(o + 1).toInt() and 255
                      val b = buf.get(o + 2).toInt() and 255
                      return (r + g + b) / 3 < thr || r < 50
                  }

                  fun laneDark(l: Int, y: Int): Boolean {
                      val cx = (w * Config.laneFractions[l]).toInt()
                      val d = (laneW / 8).coerceAtLeast(2)
                      var c = 0
                      if (dark(cx, y)) c++
                      if (dark(cx - d, y)) c++
                      if (dark(cx + d, y)) c++
                      return c >= 2
                  }

                  fun runLength(l: Int): Int {
                      val cx = (w * Config.laneFractions[l]).toInt()
                      var y = trigY
                      var top = trigY
                      var gap = 0
                      while (y >= 0) {
                          if (dark(cx, y)) { top = y; gap = 0 } else if (++gap >= 4) break
                          y--
                      }
                      return trigY - top
                  }

                  val tileH = h / 4f
                  for (l in 0 until Config.LANES) {
                      val isDark = laneDark(l, trigY)
                      when (state[l]) {
                          S.IDLE -> if (isDark) {
                              val run = runLength(l)
                              if (run >= tileH * 1.10f) {
                                  state[l] = S.HOLD
                                  holdMiss[l] = 0
                                  lastBurstTime[l] = now
                                  FlightLog.log("DET", "L$l START BURST SLIDER (run=$run)")
                                  svc.tap(l)
                              } else {
                                  state[l] = S.TAPPED
                                  t0[l] = now
                                  FlightLog.log("DET", "L$l SINGLE TAP (run=$run)")
                                  svc.tap(l)
                              }
                          }
                          S.TAPPED -> {
                              if (!isDark || (now - t0[l] >= 30L)) {
                                  state[l] = S.IDLE
                              }
                          }
                          S.HOLD -> {
                              val above = laneDark(l, trigY - 2) || laneDark(l, trigY - 4)
                              if (above) {
                                  holdMiss[l] = 0
                                  if (now - lastBurstTime[l] >= Config.BURST_INTERVAL_MS) {
                                      lastBurstTime[l] = now
                                      svc.tap(l)
                                  }
                              } else if (++holdMiss[l] >= 2) {
                                  FlightLog.log("DET", "L$l BURST SLIDER END")
                                  state[l] = S.IDLE
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # 4. TapService.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/TapService.kt
          package com.example.tilebot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.util.concurrent.ConcurrentLinkedQueue
          import kotlin.math.abs

          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
              }

              private val mainHandler = Handler(Looper.getMainLooper())
              private val tapQueue = ConcurrentLinkedQueue<Int>()
              private var inFlight = false

              private var wm: WindowManager? = null
              private var overlayContainer: LinearLayout? = null
              private var btnToggle: TextView? = null

              override fun onServiceConnected() {
                  instance = this
                  FlightLog.log("SYS", "TapService connected")
                  createFloatingUI()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  FlightLog.log("SYS", "TapService disconnected")
                  removeFloatingUI()
                  instance = null
                  return super.onUnbind(intent)
              }

              private fun createFloatingUI() {
                  if (overlayContainer != null) return
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 30
                      y = 140
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(8, 8, 8, 8)
                  }

                  val toggle = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setPadding(28, 18, 28, 18)
                  }
                  btnToggle = toggle
                  updateButtonAppearance()

                  val copyBtn = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      text = "📋 LOG"
                      setPadding(24, 18, 24, 18)
                      background = GradientDrawable().apply {
                          cornerRadius = 36f
                          setColor(Color.parseColor("#CC374151"))
                          setStroke(2, Color.WHITE)
                      }
                      setOnClickListener {
                          val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("TileBotLog", FlightLog.dump()))
                          Toast.makeText(this@TapService, "Debug Log Copied to Clipboard!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val spacer = android.view.View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(12, 1)
                  }

                  container.addView(toggle)
                  container.addView(spacer)
                  container.addView(copyBtn)

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f

                  toggle.setOnTouchListener { v, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (event.rawX - touchX).toInt()
                              params.y = startY + (event.rawY - touchY).toInt()
                              wm?.updateViewLayout(overlayContainer, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (abs(event.rawX - touchX) < 15 && abs(event.rawY - touchY) < 15) {
                                  Config.isPaused = !Config.isPaused
                                  FlightLog.log("SYS", "Bot toggled: ${if (Config.isPaused) "PAUSED" else "RUNNING"}")
                                  updateButtonAppearance()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  wm?.addView(container, params)
                  overlayContainer = container
              }

              fun refreshButton() {
                  mainHandler.post { updateButtonAppearance() }
              }

              private fun updateButtonAppearance() {
                  btnToggle?.let { btn ->
                      val bg = GradientDrawable().apply {
                          cornerRadius = 36f
                          setColor(if (Config.isPaused) Color.parseColor("#CC1F2937") else Color.parseColor("#CC10B981"))
                          setStroke(2, Color.WHITE)
                      }
                      btn.background = bg
                      btn.text = if (Config.isPaused) "▶ BOT: PAUSED" else "⏸ BOT: ON"
                  }
              }

              private fun removeFloatingUI() {
                  overlayContainer?.let {
                      try { wm?.removeView(it) } catch (_: Exception) {}
                  }
                  overlayContainer = null
                  btnToggle = null
              }

              fun tap(lane: Int) {
                  if (Config.isPaused) return
                  tapQueue.add(lane)
                  mainHandler.post { pump() }
              }

              fun releaseAll() {
                  tapQueue.clear()
              }

              private fun pump() {
                  if (inFlight) return
                  if (Config.isPaused) {
                      tapQueue.clear()
                      return
                  }

                  val builder = GestureDescription.Builder()
                  val used = HashSet<Int>()
                  var count = 0
                  var offset = 0L

                  while (true) {
                      val lane = tapQueue.poll() ?: break
                      if (lane in used) continue

                      val x = Config.screenW * Config.laneFractions[lane]
                      val y = Config.screenH * Config.triggerFrac
                      val path = Path().apply {
                          moveTo(x, y)
                          lineTo(x, y)
                      }
                      builder.addStroke(StrokeDescription(path, offset, Config.TAP_MS, false))
                      used.add(lane)
                      count++
                      offset += 2L
                      if (count >= 4) break
                  }

                  if (count == 0) return

                  inFlight = true
                  val sent = dispatchGesture(builder.build(), object : GestureResultCallback() {
                      override fun onCompleted(d: GestureDescription?) {
                          inFlight = false
                          pump()
                      }
                      override fun onCancelled(d: GestureDescription?) {
                          inFlight = false
                          pump()
                      }
                  }, null)

                  if (!sent) {
                      inFlight = false
                      mainHandler.postDelayed({ pump() }, 8L)
                  }
              }
          }
          EOF

          # 5. MainActivity.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/MainActivity.kt
          package com.example.tilebot

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          class MainActivity : ComponentActivity() {

              private val prefs by lazy { getSharedPreferences("cfg", MODE_PRIVATE) }

              private val projLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val data = r.data
                  if (r.resultCode == RESULT_OK && data != null) {
                      Config.isPaused = true
                      TapService.instance?.refreshButton()
                      startForegroundService(
                          Intent(this, CaptureService::class.java).putExtra("code", r.resultCode).putExtra("data", data)
                      )
                      Toast.makeText(this, "Capture started! Open Piano Tiles and tap the floating button.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }
              }

              private val notifLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { launchCapture() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Config.triggerFrac = prefs.getInt("trig", 65) / 100f
                  Config.darkThreshold = prefs.getInt("dark", 95)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad * 2, pad, pad) }

                  root.addView(TextView(this).apply {
                      text = "1. Enable TileBot Accessibility Service.\n" +
                          "2. Tap Start Capture and choose \"Entire screen\".\n" +
                          "3. Open the game: use the floating button to toggle ON/PAUSE, or tap LOG to copy debug data."
                  })
                  root.addView(Button(this).apply {
                      text = "1. Open accessibility settings"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(Button(this).apply { text = "2. Start Capture"; setOnClickListener { startBot() } })
                  root.addView(Button(this).apply {
                      text = "Stop Capture"
                      setOnClickListener {
                          Config.isPaused = true
                          TapService.instance?.refreshButton()
                          stopService(Intent(this@MainActivity, CaptureService::class.java))
                      }
                  })

                  slider(root, "Trigger line (% of height)", 40, 85, (Config.triggerFrac * 100).toInt()) {
                      Config.triggerFrac = it / 100f; prefs.edit().putInt("trig", it).apply()
                  }
                  slider(root, "Dark threshold (Default 95)", 40, 150, Config.darkThreshold) {
                      Config.darkThreshold = it; prefs.edit().putInt("dark", it).apply()
                  }
                  setContentView(root)
              }

              private fun startBot() {
                  if (TapService.instance == null) {
                      Toast.makeText(this, "Enable the accessibility service first", Toast.LENGTH_LONG).show(); return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS) else launchCapture()
              }

              private fun launchCapture() {
                  val mgr = getSystemService(MediaProjectionManager::class.java)
                  projLauncher.launch(mgr.createScreenCaptureIntent())
              }

              private fun slider(root: LinearLayout, label: String, min: Int, max: Int, init: Int, on: (Int) -> Unit) {
                  val tv = TextView(this).apply { text = "$label: $init"; setPadding(0, 32, 0, 0) }
                  val sb = SeekBar(this).apply {
                      this.max = max - min
                      progress = init - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                              tv.text = "$label: ${p + min}"; on(p + min)
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  root.addView(tv); root.addView(sb)
              }
          }
          EOF

          # 6. CaptureService buffer count
          sed -i 's/PixelFormat.RGBA_8888, 2/PixelFormat.RGBA_8888, 4/g' TileBot/app/src/main/java/com/example/tilebot/CaptureService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: TileBot
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TileBot-apk
          path: TileBot/app/build/outputs/apk/debug/app-debug.apk
