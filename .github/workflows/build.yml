name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and patch project
        run: |
          if [ -f TileBot.zip ]; then
            unzip -q -o TileBot.zip
          fi
          # 1. Enable AndroidX & memory headroom
          echo "android.useAndroidX=true" >> TileBot/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> TileBot/gradle.properties
          
          # 2. Fix onStart lifecycle override
          sed -i 's/onStart()/startBot()/g' TileBot/app/src/main/java/com/example/tilebot/MainActivity.kt
          
          # 3. Fast capture settings: 4 buffers + 1/4 downscale
          sed -i 's/const val SCALE = 2/const val SCALE = 4/g' TileBot/app/src/main/java/com/example/tilebot/Config.kt
          sed -i 's/PixelFormat.RGBA_8888, 2/PixelFormat.RGBA_8888, 4/g' TileBot/app/src/main/java/com/example/tilebot/CaptureService.kt
          
          # 4. Trigger height optimized for high-speed post-slider tiles (65%)
          sed -i 's/var triggerFrac = 0.70f/var triggerFrac = 0.65f/g' TileBot/app/src/main/java/com/example/tilebot/Config.kt
          sed -i 's/var lookaheadFrac = 0.52f/var lookaheadFrac = 0.38f/g' TileBot/app/src/main/java/com/example/tilebot/Config.kt
          sed -i 's/prefs.getInt("trig", 70)/prefs.getInt("trig", 65)/g' TileBot/app/src/main/java/com/example/tilebot/MainActivity.kt
          
          # 5. Remove post-hold cooling delay (react immediately to tiles after sliders)
          sed -i 's/now - lastActionTime\[lane\] >= 60L/now - lastActionTime\[lane\] >= 15L/g' TileBot/app/src/main/java/com/example/tilebot/TileDetector.kt
          
          # 6. Ultra-fast hold chunk (20ms instead of 40/60ms) so hold never starves rapid taps
          sed -i 's/const val HOLD_STEP_MS = 60L/const val HOLD_STEP_MS = 20L/g' TileBot/app/src/main/java/com/example/tilebot/Config.kt
          sed -i 's/const val HOLD_STEP_MS = 40L/const val HOLD_STEP_MS = 20L/g' TileBot/app/src/main/java/com/example/tilebot/Config.kt
          sed -i 's/const val TAP_DURATION_MS = 12L/const val TAP_DURATION_MS = 8L/g' TileBot/app/src/main/java/com/example/tilebot/Config.kt
          
          # 7. Watchdog: never freeze inFlight if gesture finishes or drops
          sed -i 's/inFlight = dispatchGesture(gesture/val sent = dispatchGesture(gesture/g' TileBot/app/src/main/java/com/example/tilebot/TapService.kt
          sed -i 's/null)/null); if (!sent) { inFlight = false; processQueue() } else { inFlight = true }/g' TileBot/app/src/main/java/com/example/tilebot/TapService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: TileBot
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TileBot-apk
          path: TileBot/app/build/outputs/apk/debug/app-debug.apk
