name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and patch project
        run: |
          if [ -f TileBot.zip ]; then
            unzip -q -o TileBot.zip
          fi
          echo "android.useAndroidX=true" >> TileBot/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> TileBot/gradle.properties

          # 1. Write Config.kt
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/Config.kt
          package com.example.tilebot

          object Config {
              const val LANES = 4
              const val SCALE = 4

              val laneFractions = floatArrayOf(0.125f, 0.375f, 0.625f, 0.875f)

              @Volatile var triggerFrac = 0.64f
              @Volatile var lookaheadFrac = 0.40f
              @Volatile var redThreshold = 52
              @Volatile var isPaused = true

              const val TAP_DURATION_MS = 10L
              const val HOLD_STEP_MS = 25L
              const val MIN_RETRIGGER_MS = 22L

              @Volatile var screenW = 0
              @Volatile var screenH = 0
          }
          EOF

          # 2. Write TileDetector.kt (3-point horizontal sampling + clean slider feed check)
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/TileDetector.kt
          package com.example.tilebot

          import android.media.Image
          import android.os.SystemClock

          class TileDetector {
              private enum class LaneState { IDLE, HOLDING, COOLING }

              private val states = Array(Config.LANES) { LaneState.IDLE }
              private val lastActionTime = LongArray(Config.LANES)
              private val holdStartTime = LongArray(Config.LANES)

              fun resetAll() {
                  for (i in 0 until Config.LANES) {
                      states[i] = LaneState.IDLE
                  }
              }

              fun process(img: Image) {
                  if (Config.isPaused) {
                      resetAll()
                      return
                  }
                  val now = SystemClock.uptimeMillis()
                  val svc = TapService.instance ?: return

                  val plane = img.planes[0]
                  val buf = plane.buffer
                  val rs = plane.rowStride
                  val ps = plane.pixelStride
                  val w = img.width
                  val h = img.height

                  val trigY = (h * Config.triggerFrac).toInt().coerceIn(4, h - 4)
                  val lookY = (h * Config.lookaheadFrac).toInt().coerceIn(4, h - 4)
                  val aboveY = (trigY - (h * 0.09f).toInt()).coerceIn(4, h - 4)
                  val dx = (w / 16).coerceAtLeast(2)

                  fun isPixelTarget(x: Int, y: Int): Boolean {
                      val o = y * rs + x * ps
                      if (o + 2 >= buf.limit()) return false
                      val r = buf.get(o).toInt() and 0xFF
                      val g = buf.get(o + 1).toInt() and 0xFF
                      val b = buf.get(o + 2).toInt() and 0xFF
                      return r < Config.redThreshold && (g < 105 || (g <= 178 && b > 185))
                  }

                  fun isStrikeTarget(cx: Int, cy: Int): Boolean {
                      return isPixelTarget(cx, cy) || isPixelTarget(cx - dx, cy) || isPixelTarget(cx + dx, cy)
                  }

                  fun isSliderStillFeeding(cx: Int): Boolean {
                      fun checkBlueOrDark(x: Int, y: Int): Boolean {
                          val o = y * rs + x * ps
                          if (o + 2 >= buf.limit()) return false
                          val r = buf.get(o).toInt() and 0xFF
                          val g = buf.get(o + 1).toInt() and 0xFF
                          val b = buf.get(o + 2).toInt() and 0xFF
                          return r < 48 && (b > 185 || g < 90)
                      }
                      return checkBlueOrDark(cx, aboveY) || checkBlueOrDark(cx - dx, aboveY) || checkBlueOrDark(cx + dx, aboveY)
                  }

                  for (lane in 0 until Config.LANES) {
                      val cx = (w * Config.laneFractions[lane]).toInt()

                      when (states[lane]) {
                          LaneState.IDLE -> {
                              if (isStrikeTarget(cx, trigY) && (now - lastActionTime[lane] >= Config.MIN_RETRIGGER_MS)) {
                                  val isLong = isStrikeTarget(cx, lookY) || isStrikeTarget(cx, aboveY)
                                  if (isLong) {
                                      states[lane] = LaneState.HOLDING
                                      holdStartTime[lane] = now
                                      lastActionTime[lane] = now
                                      svc.press(lane)
                                  } else {
                                      states[lane] = LaneState.COOLING
                                      lastActionTime[lane] = now
                                      svc.tap(lane)
                                  }
                              }
                          }
                          LaneState.HOLDING -> {
                              val minHoldElapsed = (now - holdStartTime[lane]) >= 75L
                              val stillFeeding = isSliderStillFeeding(cx)
                              val timedOut = (now - holdStartTime[lane]) > 2200L
                              if ((minHoldElapsed && !stillFeeding) || timedOut) {
                                  svc.release(lane)
                                  states[lane] = LaneState.COOLING
                                  lastActionTime[lane] = now
                              }
                          }
                          LaneState.COOLING -> {
                              if (!isStrikeTarget(cx, trigY) || (now - lastActionTime[lane] >= 55L)) {
                                  states[lane] = LaneState.IDLE
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # 3. Write TapService.kt (Floating button + Self-healing hold sync)
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/TapService.kt
          package com.example.tilebot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.TextView
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.atomic.AtomicInteger
          import kotlin.math.abs

          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var instance: TapService? = null
              }

              private class HoldState(var stroke: StrokeDescription, val x: Float, val y: Float)

              private val mainHandler = Handler(Looper.getMainLooper())
              private val tapQueue = ConcurrentLinkedQueue<Int>()
              private val activeHolds = HashMap<Int, HoldState>()
              private val keepHoldingMask = AtomicInteger(0)
              private var inFlight = false

              private var wm: WindowManager? = null
              private var floatBtn: TextView? = null

              override fun onServiceConnected() {
                  instance = this
                  createFloatingButton()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  removeFloatingButton()
                  instance = null
                  return super.onUnbind(intent)
              }

              private fun createFloatingButton() {
                  if (floatBtn != null) return
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 30
                      y = 140
                  }

                  val btn = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      setPadding(36, 20, 36, 20)
                  }
                  updateButtonAppearance(btn)

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f

                  btn.setOnTouchListener { v, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (event.rawX - touchX).toInt()
                              params.y = startY + (event.rawY - touchY).toInt()
                              wm?.updateViewLayout(v, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (abs(event.rawX - touchX) < 15 && abs(event.rawY - touchY) < 15) {
                                  Config.isPaused = !Config.isPaused
                                  if (Config.isPaused) releaseAll()
                                  updateButtonAppearance(btn)
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  wm?.addView(btn, params)
                  floatBtn = btn
              }

              fun refreshButton() {
                  mainHandler.post { floatBtn?.let { updateButtonAppearance(it) } }
              }

              private fun updateButtonAppearance(btn: TextView) {
                  val bg = GradientDrawable().apply {
                      cornerRadius = 40f
                      setColor(if (Config.isPaused) Color.parseColor("#CC1F2937") else Color.parseColor("#CC10B981"))
                      setStroke(3, Color.WHITE)
                  }
                  btn.background = bg
                  btn.text = if (Config.isPaused) "▶ BOT: PAUSED" else "⏸ BOT: ON"
              }

              private fun removeFloatingButton() {
                  floatBtn?.let {
                      try { wm?.removeView(it) } catch (_: Exception) {}
                  }
                  floatBtn = null
              }

              fun tap(lane: Int) {
                  if (Config.isPaused) return
                  tapQueue.add(lane)
                  mainHandler.post { processQueue() }
              }

              fun press(lane: Int) {
                  if (Config.isPaused) return
                  keepHoldingMask.updateAndGet { it or (1 shl lane) }
                  mainHandler.post { processQueue() }
              }

              fun release(lane: Int) {
                  keepHoldingMask.updateAndGet { it and (1 shl lane).inv() }
                  mainHandler.post { processQueue() }
              }

              fun releaseAll() {
                  keepHoldingMask.set(0)
                  tapQueue.clear()
                  mainHandler.post { processQueue() }
              }

              private fun processQueue() {
                  if (inFlight) return
                  if (Config.isPaused) {
                      activeHolds.clear()
                      return
                  }

                  val strokes = ArrayList<StrokeDescription>()
                  val lanesHandled = HashSet<Int>()
                  val mask = keepHoldingMask.get()

                  val iterator = activeHolds.entries.iterator()
                  while (iterator.hasNext()) {
                      val entry = iterator.next()
                      val lane = entry.key
                      val state = entry.value
                      val shouldContinue = (mask and (1 shl lane)) != 0

                      val path = Path().apply { moveTo(state.x, state.y) }
                      if (shouldContinue) {
                          state.stroke = state.stroke.continueStroke(path, 0L, Config.HOLD_STEP_MS, true)
                          strokes.add(state.stroke)
                          lanesHandled.add(lane)
                      } else {
                          val endStroke = state.stroke.continueStroke(path, 0L, 1L, false)
                          strokes.add(endStroke)
                          lanesHandled.add(lane)
                          iterator.remove()
                      }
                  }

                  for (lane in 0 until Config.LANES) {
                      if ((mask and (1 shl lane)) != 0 && lane !in lanesHandled) {
                          val x = Config.screenW * Config.laneFractions[lane]
                          val y = Config.screenH * Config.triggerFrac
                          val path = Path().apply { moveTo(x, y) }
                          val stroke = StrokeDescription(path, 0L, Config.HOLD_STEP_MS, true)
                          activeHolds[lane] = HoldState(stroke, x, y)
                          strokes.add(stroke)
                          lanesHandled.add(lane)
                      }
                  }

                  while (true) {
                      val lane = tapQueue.poll() ?: break
                      if (lane in lanesHandled) continue
                      val x = Config.screenW * Config.laneFractions[lane]
                      val y = Config.screenH * Config.triggerFrac
                      val path = Path().apply { moveTo(x, y) }
                      strokes.add(StrokeDescription(path, 0L, Config.TAP_DURATION_MS, false))
                      lanesHandled.add(lane)
                  }

                  if (strokes.isEmpty()) return

                  val gesture = GestureDescription.Builder().apply {
                      strokes.forEach { addStroke(it) }
                  }.build()

                  inFlight = true
                  val sent = dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          inFlight = false
                          processQueue()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          inFlight = false
                          activeHolds.clear()
                          processQueue()
                      }
                  }, null)

                  if (!sent) {
                      inFlight = false
                      activeHolds.clear()
                      mainHandler.postDelayed({ processQueue() }, 8L)
                  }
              }
          }
          EOF

          # 4. Write complete MainActivity.kt (uses startBot() to avoid ComponentActivity.onStart() conflict)
          cat << 'EOF' > TileBot/app/src/main/java/com/example/tilebot/MainActivity.kt
          package com.example.tilebot

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          class MainActivity : ComponentActivity() {

              private val prefs by lazy { getSharedPreferences("cfg", MODE_PRIVATE) }

              private val projLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val data = r.data
                  if (r.resultCode == RESULT_OK && data != null) {
                      Config.isPaused = true
                      TapService.instance?.refreshButton()
                      startForegroundService(
                          Intent(this, CaptureService::class.java).putExtra("code", r.resultCode).putExtra("data", data)
                      )
                      Toast.makeText(this, "Capture started! Open the game and tap the floating button to start.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }
              }

              private val notifLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { launchCapture() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Config.triggerFrac = prefs.getInt("trig", 64) / 100f
                  Config.redThreshold = prefs.getInt("red", 52)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(pad, pad * 2, pad, pad) }

                  root.addView(TextView(this).apply {
                      text = "1. Enable TileBot Accessibility Service (a floating button will appear).\n" +
                          "2. Tap Start Capture and choose \"Entire screen\".\n" +
                          "3. Open Piano Tiles and tap the floating button (BOT: PAUSED -> BOT: ON) when ready to play!"
                  })
                  root.addView(Button(this).apply {
                      text = "1. Open accessibility settings"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(Button(this).apply { text = "2. Start Capture"; setOnClickListener { startBot() } })
                  root.addView(Button(this).apply {
                      text = "Stop Capture"
                      setOnClickListener {
                          Config.isPaused = true
                          TapService.instance?.refreshButton()
                          stopService(Intent(this@MainActivity, CaptureService::class.java))
                      }
                  })

                  slider(root, "Trigger line (% of height)", 40, 85, (Config.triggerFrac * 100).toInt()) {
                      Config.triggerFrac = it / 100f; prefs.edit().putInt("trig", it).apply()
                  }
                  slider(root, "Red color threshold (Default 52)", 25, 95, Config.redThreshold) {
                      Config.redThreshold = it; prefs.edit().putInt("red", it).apply()
                  }
                  setContentView(root)
              }

              private fun startBot() {
                  if (TapService.instance == null) {
                      Toast.makeText(this, "Enable the accessibility service first", Toast.LENGTH_LONG).show(); return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS) else launchCapture()
              }

              private fun launchCapture() {
                  val mgr = getSystemService(MediaProjectionManager::class.java)
                  projLauncher.launch(mgr.createScreenCaptureIntent())
              }

              private fun slider(root: LinearLayout, label: String, min: Int, max: Int, init: Int, on: (Int) -> Unit) {
                  val tv = TextView(this).apply { text = "$label: $init"; setPadding(0, 32, 0, 0) }
                  val sb = SeekBar(this).apply {
                      this.max = max - min
                      progress = init - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                              tv.text = "$label: ${p + min}"; on(p + min)
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  root.addView(tv); root.addView(sb)
              }
          }
          EOF

          # 5. Ensure 4 buffers in CaptureService.kt
          sed -i 's/PixelFormat.RGBA_8888, 2/PixelFormat.RGBA_8888, 4/g' TileBot/app/src/main/java/com/example/tilebot/CaptureService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: TileBot
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TileBot-apk
          path: TileBot/app/build/outputs/apk/debug/app-debug.apk
